[package]
name = "lca-cli"
version.workspace = true
edition.workspace = true
publish = false
description = "Command-line interface for the local coding agent foundation."
autobins = false

[dependencies]
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
lca-config = { path = "../../crates/lca-config" }
lca-core = { path = "../../crates/lca-core" }
lca-model-runtime = { path = "../../crates/lca-model-runtime" }
lca-ollama = { path = "../../crates/lca-ollama" }
lca-tools = { path = "../../crates/lca-tools" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std", "ansi"] }

[dev-dependencies]
async-trait = "0.1"
lca-platform = { path = "../../crates/lca-platform" }
lca-tools = { path = "../../crates/lca-tools" }
serde_json = "1"

[lib]
name = "lca_cli"
path = "src/lib.rs"

[[bin]]
name = "lca"
path = "src/main.rs"

[lints]
workspace = true
