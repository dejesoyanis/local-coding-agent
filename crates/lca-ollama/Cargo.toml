[package]
name = "lca-ollama"
version.workspace = true
edition.workspace = true
publish = false
description = "Local Ollama health checks and the model-runtime adapter."

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
lca-model-runtime = { path = "../lca-model-runtime" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
ureq = { version = "2", default-features = false }
url = "2"

[dev-dependencies]
lca-model-runtime = { path = "../lca-model-runtime", features = ["contract"] }
socket2 = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
tracing = "0.1"

[lints]
workspace = true
