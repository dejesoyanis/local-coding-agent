[package]
name = "lca-core"
version.workspace = true
edition.workspace = true
publish = false
description = "Domain types and the agent controllers."

[dependencies]
async-trait = "0.1"
lca-model-runtime = { path = "../lca-model-runtime" }
lca-tools = { path = "../lca-tools" }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
